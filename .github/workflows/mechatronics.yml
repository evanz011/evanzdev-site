name: Session reminder

on:
  schedule:
    # minute hour * * day  (0=Sun, 2=Tue, 4=Thu) — times are UTC
    - cron: "0 17 * * 2"   # Tuesday 6pm UK
    - cron: "0 17 * * 4"   # Thursday 6pm UK
    - cron: "0 17 * * 0"   # Sunday 6pm UK
  workflow_dispatch:

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        run: |
          curl -s \
            -H "Title: Mission: Engineer" \
            -H "Tags: rocket" \
            -d "6pm check-in: have you done your project today? Open the tracker and tick it off - or grab 20 minutes now." \
            ntfy.sh/mechatronics
